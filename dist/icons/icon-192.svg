<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <rect width="192" height="192" rx="32" fill="#0a1a0a"/>
  <rect width="192" height="192" rx="32" fill="url(#grad)"/>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a1a"/>
      <stop offset="100%" style="stop-color:#0a1a0a"/>
    </linearGradient>
  </defs>
  <!-- Gold border ring -->
  <rect x="6" y="6" width="180" height="180" rx="28" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.6"/>
  <!-- BJ text -->
  <text x="96" y="108" font-family="Georgia, serif" font-size="72" font-weight="700" text-anchor="middle"
    fill="url(#textgrad)">BJ</text>
  <defs>
    <linearGradient id="textgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#b8860b"/>
    </linearGradient>
  </defs>
  <!-- Golf flag -->
  <line x1="130" y1="130" x2="130" y2="160" stroke="#FFD700" stroke-width="2"/>
  <polygon points="130,130 148,138 130,146" fill="#FFD700" opacity="0.8"/>
  <!-- 2026 year -->
  <text x="96" y="178" font-family="Georgia, serif" font-size="18" font-weight="400" text-anchor="middle"
    fill="#b8860b" letter-spacing="3">2026</text>
</svg>
