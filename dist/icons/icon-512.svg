<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#0a1a0a"/>
  <rect width="512" height="512" rx="80" fill="url(#grad512)"/>
  <defs>
    <linearGradient id="grad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a1a"/>
      <stop offset="100%" style="stop-color:#0a1a0a"/>
    </linearGradient>
    <linearGradient id="textgrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#b8860b"/>
    </linearGradient>
  </defs>
  <!-- Gold border ring -->
  <rect x="14" y="14" width="484" height="484" rx="68" fill="none" stroke="#FFD700" stroke-width="3" opacity="0.6"/>
  <!-- BJ text -->
  <text x="256" y="286" font-family="Georgia, serif" font-size="190" font-weight="700" text-anchor="middle"
    fill="url(#textgrad512)">BJ</text>
  <!-- Golf flag decoration -->
  <line x1="340" y1="340" x2="340" y2="420" stroke="#FFD700" stroke-width="4"/>
  <polygon points="340,340 390,360 340,380" fill="#FFD700" opacity="0.8"/>
  <!-- 2026 year -->
  <text x="256" y="476" font-family="Georgia, serif" font-size="48" font-weight="400" text-anchor="middle"
    fill="#b8860b" letter-spacing="8">2026</text>
</svg>
